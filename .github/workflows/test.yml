name: Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECRAFTERS_SECRET_OPENROUTER_API_KEY: ${{ secrets.CODECRAFTERS_SECRET_OPENROUTER_API_KEY }}

      OPENROUTER_API_KEY: ${{ vars.OPENROUTER_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ vars.OPENROUTER_API_KEY }}

      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
      ANTHROPIC_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}

      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}

      # Explicitly empty
      ANTHROPIC_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: 1.25.5

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run tests
        run: make test
