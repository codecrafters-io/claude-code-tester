name: Test

on: push

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      EXECUTABLE_MEMORY_LIMIT_IN_MB: "8192"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: 1.25.5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run offline tests
        run: make test_offline

  test:
    runs-on: ubuntu-latest
    env:
      CODECRAFTERS_SECRET_OPENROUTER_API_KEY: ${{ secrets.CODECRAFTERS_SECRET_OPENROUTER_API_KEY }}
      EXECUTABLE_MEMORY_LIMIT_IN_MB: "8192"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6.1.0
        with:
          go-version: 1.25.5

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.266

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run live-model tests
        run: make test_live

  lsp_compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned compatibility tools
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.266
          npm install --prefix "$RUNNER_TEMP/lsp-pyright" --ignore-scripts pyright@1.1.414
      - name: Check the reference client against Pyright
        run: make test_lsp_with_pyright PYRIGHT_LANGSERVER="$RUNNER_TEMP/lsp-pyright/node_modules/.bin/pyright-langserver"
      - name: Check Claude Code against Pyright
        run: make test_lsp_with_claude_code PYRIGHT_LANGSERVER="$RUNNER_TEMP/lsp-pyright/node_modules/.bin/pyright-langserver"
